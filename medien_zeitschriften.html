
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Medienliste – KÖB Obernau</title>

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="https://eopac.katti.workers.dev/style.css?v=4">
<style>
/* Nur Zeitschriften: Covergalerie, unabhängig von externer style.css */
#zeitschriften-ansicht[hidden] { display: none !important; }
.zeitschriften-anzahl { margin: 0 0 1rem; color: #666; font-size: .96rem; }
.zeitschriften-raster { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.5rem 1.2rem; }
.zeitschrift-kachel { min-width: 0; text-align: center; }
.zeitschrift-kachel a { display: block; text-decoration: none; color: #7a431b; }
.zeitschrift-cover { width: min(100%, 170px); aspect-ratio: 3 / 4; margin: 0 auto .6rem; border-radius: 3px; overflow: hidden; background: #f7f4ef; box-shadow: 0 3px 12px #00000018; display: flex; align-items: center; justify-content: center; }
.zeitschrift-cover img { display: block; width: 100%; height: 100%; object-fit: contain; }
.zeitschrift-ersatz { width: 100%; height: 100%; padding: .6rem; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(145deg,#d8b98c,#f1e7dc); }
.zeitschrift-ersatz b { display: block; font-size: .65rem; letter-spacing: .1em; color: #7a431b; }
.zeitschrift-ersatz strong { font-size: 1.05rem; line-height: 1.2; color: #333; overflow-wrap: anywhere; }
.zeitschrift-name { display: block; font-weight: 600; font-size: .95rem; line-height: 1.4; }
.zeitschrift-heft { display: block; font-size: .8rem; color: #666; margin-top: .2rem; }
.zeitschrift-kachel a:hover .zeitschrift-name { text-decoration: underline; }
.zeitschrift-kachel a:focus-visible { outline: 2px solid #7a431b; outline-offset: 4px; }
body.ist-zeitschriften #eopac-ecjajem { display: none !important; }
@media (max-width: 760px) { .zeitschriften-raster { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 1rem; } }
@media (max-width: 500px) { .zeitschriften-raster { grid-template-columns: repeat(2,minmax(0,1fr)); } }
</style>
</head>

<body>
<main>
  <header>
    <h1>Unsere Medien</h1>
  </header>

<nav class="medien-navigation"
     aria-label="Medienlisten">

  <a class="medien-nav-item" href="medien.html?liste=tonies" data-liste="tonies">
    <img src="https://www.bistum-wuerzburg.de/fileadmin/Bistum_Folgeseiten/KOEB_Obernau/tonies.png" alt="" loading="eager">
    <span>Tonies</span>
  </a>

  <a class="medien-nav-item"
     href="medien.html?liste=bilderbucher"
     data-liste="bilderbucher">
    <img src="https://www.bistum-wuerzburg.de/fileadmin/Bistum_Folgeseiten/KOEB_Obernau/bilderbuecher.png" alt="" loading="eager">
    <span>Bilderbücher</span>
  </a>

  <a class="medien-nav-item"
     href="medien.html?liste=spiele"
     data-liste="spiele">
    <img src="https://www.bistum-wuerzburg.de/fileadmin/Bistum_Folgeseiten/KOEB_Obernau/spiele_01.png" alt="" loading="eager">
    <span>Spiele</span>
  </a>

  <a class="medien-nav-item"
     href="medien.html?liste=erstleser"
     data-liste="erstleser">
    <img src="https://www.bistum-wuerzburg.de/fileadmin/Bistum_Folgeseiten/KOEB_Obernau/erstleser.png" alt="" loading="eager">
    <span>Erstleser</span>
  </a>

  <a class="medien-nav-item"
     href="medien.html?liste=belletristik"
     data-liste="belletristik">
    <img src="https://www.bistum-wuerzburg.de/fileadmin/Bistum_Folgeseiten/KOEB_Obernau/belletristik.png" alt="" loading="eager">
    <span>Belletristik</span>
  </a>

  <a class="medien-nav-item"
     href="medien.html?liste=zeitschriften-alle"
     data-liste="zeitschriften-alle">
    <img src="https://www.bistum-wuerzburg.de/fileadmin/Bistum_Folgeseiten/KOEB_Obernau/zeitschriften.png" alt="" loading="eager">
    <span>Zeitschriften</span>
  </a>

</nav>

  <section id="zeitschriften-ansicht" hidden aria-label="Zeitschriftentitel">
    <p id="zeitschriften-status">Zeitschriften werden geladen …</p>
    <p id="zeitschriften-anzahl" class="zeitschriften-anzahl" hidden></p>
    <div id="zeitschriften-raster" class="zeitschriften-raster"></div>
  </section>

  <!-- Originaldaten des eOPAC -->
  <div id="eopac-ecjajem">
    Medien werden geladen …
  </div>
</main>

<script>
"use strict";
const params = new URLSearchParams(location.search);
const listenAlias = params.get("liste") || "tonies";
const istZeitschriften = listenAlias === "zeitschriften-alle";
const quelle = document.getElementById("eopac-ecjajem");
const ansicht = document.getElementById("zeitschriften-ansicht");
const raster = document.getElementById("zeitschriften-raster");
const status = document.getElementById("zeitschriften-status");
const anzahl = document.getElementById("zeitschriften-anzahl");

for (const link of document.querySelectorAll(".medien-nav-item")) {
  const aktiv = link.dataset.liste === listenAlias;
  link.classList.toggle("active", aktiv);
  if (aktiv) link.setAttribute("aria-current", "page");
}

if (istZeitschriften) {
  document.body.classList.add("ist-zeitschriften");
  ansicht.hidden = false;
  document.querySelector("h1").textContent = "Unsere Zeitschriften";
}

// Zeitschriftennamen aus Hefttiteln ableiten; Regeln können bei Bedarf ergänzt werden.
function leseHeft(titel) {
  let name = titel.trim().replace(/\s+/g, " ");
  const jahr = [...name.matchAll(/\b(?:19|20)\d{2}\b/g)].map(m => Number(m[0])).at(-1) || 0;
  const jahrPos = name.search(/\b(?:19|20)\d{2}\b/);
  // z.B. "Der Spiegel 2026/17a" oder "Anna - 11/2026"
  let nummer = 0;
  const nr = name.match(/\b(?:19|20)\d{2}\s*[\/\-]\s*(\d{1,3})[a-z]?\b/i)
      || name.match(/\b(?:Ausgabe|Heft|Nr\.?|Nummer)\s*[:#.]?\s*(\d{1,3})\b/i)
      || name.match(/\b(\d{1,3})\s*\/\s*(?:19|20)\d{2}\b/i);
  if (nr) nummer = Number(nr[1]);
  if (jahrPos > 0) name = name.slice(0, jahrPos);
  name = name.replace(/\s+\d{1,3}\s*\/\s*$/, "").replace(/\s*[-–:,]\s*$/, "").replace(/\s+(?:Ausgabe|Heft|Nr\.?|Nummer)\s*\d+.*$/i, "").trim();
  // Monatliche Ausgaben ohne vierstellige Jahreszahl nur konservativ erkennen
  const monat = (titel.match(/\b(Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\b/i) || [])[1];
  const monate = ["januar","februar","märz","april","mai","juni","juli","august","september","oktober","november","dezember"];
  if (monat && !nummer) nummer = monate.indexOf(monat.toLowerCase()) + 1;
  if (monat) name = name.replace(new RegExp("\\s*[-–:]?\\s*" + monat + ".*$", "i"), "").trim();
  return { name: name || titel.trim(), jahr, nummer };
}

function lesen(element) {
  const a = element.querySelector(".eopac-embedded-listing-element-title a") || element.querySelector("h3 a");
  if (!a) return null;
  const titel = a.textContent.trim();
  const heft = leseHeft(titel);
  const img = element.querySelector(".eopac-embedded--cover img");
  return { ...heft, titel, href: a.href, bild: img?.currentSrc || img?.src || "" };
}

function renderZeitschriften() {
  if (!istZeitschriften) return;
  const elemente = [...quelle.querySelectorAll(".eopac-embedded-listing-element")];
  if (!elemente.length) return;
  const gruppen = new Map();
  for (const element of elemente) {
    const heft = lesen(element);
    if (!heft) continue;
    const key = heft.name.toLocaleLowerCase("de").normalize("NFKC");
    const alt = gruppen.get(key);
    // Neueste nach Jahr, dann Heftnummer; bei Gleichstand erster eOPAC-Treffer
    if (!alt || heft.jahr > alt.jahr || (heft.jahr === alt.jahr && heft.nummer > alt.nummer)) gruppen.set(key, heft);
  }
  const daten = [...gruppen.values()].sort((a,b) => a.name.localeCompare(b.name, "de"));
  const fragment = document.createDocumentFragment();
  for (const heft of daten) {
    const article = document.createElement("article"); article.className = "zeitschrift-kachel";
    const link = document.createElement("a"); link.href = heft.href; link.target = "_blank"; link.rel = "noopener noreferrer";
    const cover = document.createElement("div"); cover.className = "zeitschrift-cover";
    if (heft.bild) {
      const img = document.createElement("img"); img.src = heft.bild; img.alt = "Cover: " + heft.titel; img.loading = "lazy";
      img.onerror = () => {
        img.remove();
        const ersatz = document.createElement("div"); ersatz.className = "zeitschrift-ersatz";
        const label = document.createElement("b"); label.textContent = "ZEITSCHRIFT";
        const name = document.createElement("strong"); name.textContent = heft.name;
        ersatz.append(label, name); cover.appendChild(ersatz);
      };
      cover.appendChild(img);
    } else {
      const ersatz = document.createElement("div"); ersatz.className = "zeitschrift-ersatz";
      const label = document.createElement("b"); label.textContent = "ZEITSCHRIFT";
      const name = document.createElement("strong"); name.textContent = heft.name;
      ersatz.append(label, name); cover.appendChild(ersatz);
    }
    const titel = document.createElement("span"); titel.className = "zeitschrift-name"; titel.textContent = heft.name;
    const ausgabe = document.createElement("span"); ausgabe.className = "zeitschrift-heft";
    ausgabe.textContent = [heft.jahr || "", heft.nummer ? "Heft " + heft.nummer : ""].filter(Boolean).join(" · ");
    link.append(cover, titel);
    if (ausgabe.textContent) link.appendChild(ausgabe);
    article.appendChild(link); fragment.appendChild(article);
  }
  raster.replaceChildren(fragment);
  status.hidden = daten.length > 0;
  anzahl.hidden = !daten.length;
  anzahl.textContent = daten.length + " verschiedene Zeitschriftentitel (aus " + elemente.length + " geladenen Ausgaben)";
}

let renderTimer;
if (istZeitschriften) {
  const observer = new MutationObserver(() => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderZeitschriften, 120);
  });
  observer.observe(quelle, { childList: true, subtree: true });
}

var ecjajem;
(function (d,t) {
  const s = d.createElement(t);
  const options = {
    bibid: "BGX429094", formHash: "ecjajem", async: true,
    feature: "medialist", alias: listenAlias, format: "",
    cover: true, actions: true, styles: false, rak: true, heading: "h3"
  };
  s.src = "https://www.eopac.net/static/js/embed_inline-min.js";
  s.onload = () => {
    try {
      ecjajem = new BVSeOPACinline();
      ecjajem.initialize(options);
      ecjajem.inject();
      renderZeitschriften();
    } catch (e) {
      console.error("eOPAC-Fehler:", e);
      if (istZeitschriften) status.textContent = "Die Zeitschriften konnten nicht geladen werden.";
      else quelle.textContent = "Die Medienliste konnte nicht geladen werden.";
    }
  };
  s.onerror = () => {
    if (istZeitschriften) status.textContent = "Der eOPAC ist momentan nicht erreichbar.";
    else quelle.textContent = "Der eOPAC ist momentan nicht erreichbar.";
  };
  d.head.appendChild(s);
})(document,"script");
</script>
</body>
</html>
