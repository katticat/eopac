
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Medienliste – KÖB Obernau</title>

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="./style.css?v=4">
</head>

<body>
<main>
  <header>
    <h1>Unsere Medien</h1>
  </header>

<nav class="medien-navigation"
     aria-label="Medienlisten">

  <a class="medien-nav-item" href="tonies.html" data-liste="tonies">
    <img src="https://www.bistum-wuerzburg.de/fileadmin/Bistum_Folgeseiten/KOEB_Obernau/tonies.png" alt="" loading="eager">
    <span>Tonies</span>
  </a>

  <a class="medien-nav-item"
     href="tonies.html?liste=liste2"
     data-liste="liste2">
    <span class="medien-nav-placeholder">2</span>
    <span>Liste 2</span>
  </a>

  <a class="medien-nav-item"
     href="tonies.html?liste=liste3"
     data-liste="liste3">
    <span class="medien-nav-placeholder">3</span>
    <span>Liste 3</span>
  </a>

  <a class="medien-nav-item"
     href="tonies.html?liste=liste4"
     data-liste="liste4">
    <span class="medien-nav-placeholder">4</span>
    <span>Liste 4</span>
  </a>

  <a class="medien-nav-item"
     href="tonies.html?liste=liste5"
     data-liste="liste5">
    <span class="medien-nav-placeholder">5</span>
    <span>Liste 5</span>
  </a>

  <a class="medien-nav-item"
     href="tonies.html?liste=liste6"
     data-liste="liste6">
    <span class="medien-nav-placeholder">6</span>
    <span>Liste 6</span>
  </a>

</nav>

  <!-- Originaldaten des eOPAC -->
  <div id="eopac-ecjajem">
    Medien werden geladen …
  </div>
</main>

<script>
"use strict";

// Konfiguration der Medienliste
const params = new URLSearchParams(location.search);
const listenAlias = params.get("liste") || "tonies";

const quelle = document.getElementById("eopac-ecjajem");
const ziel = document.getElementById("medienliste");
const statusText = document.getElementById("status");

const bearbeitet = new WeakSet();

function formatMedium(element) {
  if (bearbeitet.has(element)) return;

  // Original-Link zum Katalog
  const action = element.querySelector(
    "a.eopac-embedded--action"
  );

  // Titel-Link suchen, unabhängig vom Heading-Tag
  const titelLink = [...element.querySelectorAll("a")]
    .find(a =>
      a !== action &&
      a.textContent.trim().length > 0 &&
      !a.closest(
        ".eopac-embedded-listing-element-actions"
      )
    );

  if (!titelLink || !action) return;

  // Daten sichern
  const titel = titelLink.textContent.trim();
  const bild = element.querySelector("img");
  const status = element.querySelector(
    ".eopac-embedded--status"
  );

  // Altersempfehlung, soweit vorhanden
  const text = element.textContent || "";
  const alter = text.match(
    /Altersempfehlung:\s*ab\s*(\d+)\s*Jahren?/i
  );

  // Karte erstellen
  const card = document.createElement("article");
  card.className = "medium-card";

  // Cover
  const cover = document.createElement("div");
  cover.className = "medium-cover";

  if (bild) {
    const img = document.createElement("img");
    img.src = bild.currentSrc || bild.src;
    img.alt = titel;
    img.loading = "lazy";

    const link = document.createElement("a");
    link.href = titelLink.href;
    link.appendChild(img);
    cover.appendChild(link);
  }

  // Informationen
  const info = document.createElement("div");
  info.className = "medium-info";

  const title = document.createElement("a");
  title.className = "medium-title";
  title.href = titelLink.href;
  title.textContent = titel;

  info.appendChild(title);

  if (alter) {
    const meta = document.createElement("p");
    meta.className = "medium-meta";
    meta.textContent = "Ab " + alter[1] + " Jahren";
    info.appendChild(meta);
  }

  // Verfügbarkeit
  const actions = document.createElement("div");
  actions.className = "medium-actions";

  const dot = document.createElement("span");
  dot.className = "medium-dot";

  if (status) {
    if (status.classList.contains(
      "eopac-embedded--status-green")) {
      dot.classList.add("available");
      dot.title = "Entleihbar";
    } else if (status.classList.contains(
      "eopac-embedded--status-red")) {
      dot.classList.add("unavailable");
      dot.title = "Nicht entleihbar";
    } else {
      dot.title = status.title || "Status unbekannt";
    }
  } else {
    dot.title = "Status unbekannt";
  }

  const katalog = document.createElement("a");
  katalog.href = action.href;
  katalog.textContent = "Im Katalog aufrufen";

  actions.append(dot, katalog);
  info.appendChild(actions);

  card.append(cover, info);

  // Karte in eigener Medienliste ausgeben
  ziel.appendChild(card);
  bearbeitet.add(element);

  statusText.hidden = true;
}

// Vom eOPAC geladene Medien auswerten
function aktualisieren() {
  quelle.querySelectorAll(
    ".eopac-embedded-listing-element"
  ).forEach(formatMedium);
}

const observer = new MutationObserver(aktualisieren);

observer.observe(quelle, {
  childList: true,
  subtree: true
});

// eOPAC laden
var ecjajem;

(function(d, t) {
  const s = d.createElement(t);

  const options = {
    bibid: "BGX429094",
    formHash: "ecjajem",
    async: true,
    feature: "medialist",
    alias: listenAlias,
    format: "",
    cover: true,
    actions: true,
    styles: false,
    rak: true,
    heading: "h3"
  };

  s.src =
    "https://www.eopac.net/static/js/embed_inline-min.js";

  s.onload = function() {
    try {
      ecjajem = new BVSeOPACinline();
      ecjajem.initialize(options);
      ecjajem.inject();
      aktualisieren();
    } catch (error) {
      console.error("eOPAC-Fehler:", error);
      statusText.hidden = false;
      statusText.textContent =
        "Die Medienliste konnte nicht geladen werden.";
    }
  };

  s.onerror = function() {
    statusText.hidden = false;
    statusText.textContent =
      "Der eOPAC ist momentan nicht erreichbar.";
  };

  d.head.appendChild(s);
})(document, "script");
</script>
</body>
</html>
