
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Öffnungszeiten – KÖB Obernau</title>

  <link rel="stylesheet"
        href="https://eopac.pages.dev/style.css?v=5">

  <style>
    /* Öffnungszeiten */
    #eopac-ecjajeo {
      font-family: Arial, Helvetica, sans-serif;
      color: #333333;
      line-height: 1.5;
    }

    #eopac-ecjajeo h3 {
      color: #7a431b;
      margin: 1.25rem 0 0.75rem;
    }

    /* Öffnungsstatus */
    .opening-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .opening-status-dot {
      display: inline-block;
      flex: 0 0 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #999999;
    }

    .opening-status-dot.open {
      background: #299447;
    }

    .opening-status-dot.closed {
      background: #cf3838;
    }
  </style>
</head>

<body>
<main>

  <div id="eopac-ecjajeo">
    Öffnungszeiten werden geladen …
  </div>

</main>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const tag = params.get("tag") || "";

var ecjajeo;

/* eOPAC-Öffnungszeiten laden */
(function(d, t) {
  const s = d.createElement(t);

  const options = {
    bibid: "BGX429094",
    formHash: "ecjajeo",
    async: true,
    feature: "openings",
    openings_table: false,
    closings: tag !== "short",
    specialopenings: tag !== "short",
    styles: false,
    heading: "h3"
    };

}

  let done = false;

  s.src =
    "https://www.eopac.net/static/js/embed_inline-min.js";

  s.onload = s.onreadystatechange = function() {
    if (!done &&
        (!this.readyState ||
         this.readyState === "loaded" ||
         this.readyState === "complete")) {

      done = true;

      try {
        ecjajeo = new BVSeOPACinline();
        ecjajeo.initialize(options);
        ecjajeo.inject();
      } catch (error) {
        console.error("eOPAC-Fehler:", error);
      }
    }
  };

  s.onerror = function() {
    console.error("eOPAC-Skript konnte nicht geladen werden.");
  };

  d.head.appendChild(s);

})(document, "script");


/* ======================================
   Ampel für Öffnungsstatus
   ====================================== */

(function() {
  const container =
    document.getElementById("eopac-ecjajeo");

  function aktualisiereAmpel() {
    // Nur den Öffnungszeitenbereich durchsuchen
    const elemente = container.querySelectorAll("*");

    for (const el of elemente) {
      if (el.classList.contains("opening-status")) {
        continue;
      }

      // Nur Elemente mit eigenem Text prüfen
      const text = [...el.childNodes]
        .filter(node => node.nodeType === Node.TEXT_NODE)
        .map(node => node.textContent)
        .join(" ")
        .trim();

      const match = text.match(
        /Wir haben aktuell\s+(geöffnet|geschlossen)/i
      );

      if (!match) continue;

      const dot = document.createElement("span");
      dot.className = "opening-status-dot";

      const offen = match[1].toLowerCase() === "geöffnet";

      dot.classList.add(
        offen ? "open" : "closed"
      );

      dot.setAttribute("aria-hidden", "true");

      el.classList.add("opening-status");
      el.prepend(dot);
    }
  }

  const observer = new MutationObserver(
    aktualisiereAmpel
  );

  observer.observe(container, {
    childList: true,
    subtree: true
  });

  aktualisiereAmpel();
})();
</script>

</body>
</html>
