
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Unsere Tonies – KÖB Obernau</title>

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <h1>Unsere Tonies</h1>
    </header>

    <div id="eopac-ecjajem">
      <p>Die Tonies werden geladen …</p>
    </div>
  </main>

  <script>
    const container =
      document.getElementById("eopac-ecjajem");

    
function formatMedium(element) {
  if (element.dataset.compact === "true") return;

  const titleLink = element.querySelector("h3 a");
  const image = element.querySelector("img");
  const action = element.querySelector(
    ".eopac-embedded--action"
  );
  const status = element.querySelector(
    ".eopac-embedded--status"
  );

  if (!titleLink || !action) return;

  const card = document.createElement("div");
  card.className = "medium-card";

  // Cover
  const cover = document.createElement("div");
  cover.className = "medium-cover";

  if (image) {
    const img = image.cloneNode(true);
    img.removeAttribute("style");
    img.loading = "lazy";
    img.alt = titleLink.textContent.trim();

    const coverLink = document.createElement("a");
    coverLink.href = titleLink.href;
    coverLink.appendChild(img);
    cover.appendChild(coverLink);
  }

  // Medieninformationen
  const info = document.createElement("div");
  info.className = "medium-info";

  const title = document.createElement("a");
  title.className = "medium-title";
  title.href = titleLink.href;
  title.textContent = titleLink.textContent.trim();

  info.appendChild(title);

  // Verfügbarkeit und Kataloglink
  const actions = document.createElement("div");
  actions.className = "medium-actions";

  const dot = document.createElement("span");
  dot.className = "medium-dot";

  if (status) {
    if (status.classList.contains(
      "eopac-embedded--status-green")) {
      dot.classList.add("available");
    } else if (status.classList.contains(
      "eopac-embedded--status-red")) {
      dot.classList.add("unavailable");
    } else if (status.classList.contains(
      "eopac-embedded--status-yellow")) {
      dot.classList.add("other");
    }
    dot.title = status.title || "Status unbekannt";
  } else {
    dot.title = "Status unbekannt";
  }

  const catalogLink = document.createElement("a");
  catalogLink.href = action.href;
  catalogLink.textContent = "Im Katalog aufrufen";

  actions.append(dot, catalogLink);
  info.appendChild(actions);

  card.append(cover, info);

  element.dataset.compact = "true";
  element.replaceChildren(card);
}


    // Wartet auf die asynchron geladenen eOPAC-Daten
    const observer = new MutationObserver(() => {
      container.querySelectorAll(
        ".eopac-embedded-listing-element"
      ).forEach(formatMedium);
    });

    observer.observe(container, {
      childList: true,
      subtree: true
    });

    // Offizielle eOPAC-Einbindung
    var ecjajem;

    (function(d, t) {
      var s = d.createElement(t);

      var options = {
        bibid: "BGX429094",
        formHash: "ecjajem",
        async: true,
        feature: "medialist",
        alias: "tonies",
        format: "",
        cover: true,
        actions: true,
        styles: false,
        rak: true,
        heading: "h3"
      };

      var done = false;

      s.src =
        "https://www.eopac.net/static/js/embed_inline-min.js";

      s.onload = s.onreadystatechange = function() {
        if (!done &&
            (!this.readyState ||
             this.readyState === "loaded" ||
             this.readyState === "complete")) {
          done = true;

          try {
            ecjajem = new BVSeOPACinline();
            ecjajem.initialize(options);
            ecjajem.inject();
          } catch (e) {
            console.error("eOPAC-Fehler:", e);
          }
        }
      };

      var scr = d.getElementsByTagName(t)[0];
      scr.parentNode.insertBefore(s, scr);

    })(document, "script");
  </script>
</body>
</html>
